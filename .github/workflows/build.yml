name: Build Casio App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # This is the magic line. It loads a pre-configured Linux environment 
    # where all the Casio tools are already installed and working.
    container: manawyrm/fxsdk-docker:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile App
        run: |
          # 1. Create a pristine Casio project structure
          fxsdk new fx casio_app
          
          # 2. Overwrite the template code with your actual C code
          cp src/main.c casio_app/src/main.c
          
          # 3. Enter the folder and build it!
          cd casio_app
          fxsdk build-fx
          
          # 4. Move the finished app up so GitHub can upload it
          cp *.g1a ../

      - name: Upload .g1a File
        uses: actions/upload-artifact@v4
        with:
          name: serial-test-app
          path: '*.g1a'
